<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/output.css" />
    <link rel="icon" href="public/sun.svg" type="image/svg" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <title>Portfolio</title>
  </head>
  <body class="bg-black">
    <header class="flex justify-center bg-purple-400 rounded-sm">
      <nav id="navbar">
        <ul class="flex flex-row justify-between items-center space-x-4">
          <li class="hover:bg-purple-700 p-2 rounded transition duration-300">
            <a href="#welcome-section" class="nav-link">Welcome</a>
          </li>
          <li class="hover:bg-purple-700 p-2 rounded transition duration-300">
            <a href="#projects" class="nav-link">Projects</a>
          </li>
          <li class="hover:bg-purple-700 p-2 rounded transition duration-300">
            <a href="#contact" class="nav-link">Contact</a>
          </li>
        </ul>
      </nav>
    </header>

    <section
      id="welcome-section"
      class="relative flex flex-col justify-center items-center h-screen overflow-hidden"
    >
      <h1
        class="relative z-10 text-white text-4xl font-light border border-white p-2 flex-wrap text-center"
      >
        Hello, I'm Krista.
      </h1>
      <p class="relative z-10 text-lg text-white mt-2">A Front-End Developer</p>
    </section>

    <section
      id="projects"
      class="text-white flex flex-col items-center p-5 my-20"
    >
      <h1
        class="p-2 m-5 text-purple-50 font-extralight text-2xl border-b border-white"
      >
        These are some of my projects
      </h1>
      <div
        class="projects p-2 m-5 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3"
      ></div>

      <a href="" class="show-all">
        Show All <i class="ri-arrow-right-s-line"></i>
      </a>
    </section>
    <section
      id="contact"
      class="flex flex-col justify-center text-wrap items-center p-5 my-20 m-5 text-white gap-5"
    >
      <h1 class="text-2xl p-2">Let's work together!</h1>
      <p class="text-2xl p-1.5 mb-5 text-purple-400 italic font-extralight">
        What's your favorite sandwich?
      </p>
      <div
        class="social-medias flex flex-row justify-between items-center gap-6"
      ></div>
      <p class="pt-5 text-gray-50">
        So Call Me <em class="text-gradient">Maybe..?</em>
      </p>
    </section>
    <footer
      title="Thanks for visiting!c:"
      class="bg-purple-400 flex justify-center items-center p-1.5"
    >
      @<span id="year" class="mr-1"></span>sunnycc17_
    </footer>
  </body>
  <script type="module" src="/script.js"></script>
  <!-- Include the JS module -->
</html>
